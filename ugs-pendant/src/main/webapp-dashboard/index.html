<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UGS Dashboard</title>

    <!-- Lets "Install app"/"Add to Home Screen" open this without the
         browser's own address bar and tabs, same as a native app - Chrome/
         Edge/Android read the manifest below; iOS/iPadOS's Safari (which
         predates and still doesn't fully support the manifest for this)
         needs these instead. -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1c1e1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UGS" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
