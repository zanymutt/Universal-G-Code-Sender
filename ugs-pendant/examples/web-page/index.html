<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Page</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      min-width: 280px;
      font: 14px/1.35 system-ui, sans-serif;
      background: #17191c;
      color: #e8eaed;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid #34383d;
      background: #202327;
    }
    input {
      min-width: 0;
      flex: 1;
      height: 38px;
      padding: 7px 10px;
      border: 1px solid #4a5058;
      border-radius: 4px;
      background: #111315;
      color: inherit;
      font: inherit;
    }
    button {
      min-height: 38px;
      padding: 7px 12px;
      border: 0;
      border-radius: 4px;
      background: #454ce5;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button.secondary { background: #3b4048; }
    button:disabled { opacity: .55; cursor: wait; }
    #message {
      min-height: 22px;
      padding: 5px 10px;
      color: #aeb6c0;
      overflow-wrap: anywhere;
    }
    #message.error { color: #ff9b9b; }
    #page {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: 0;
      background: white;
    }
  </style>
</head>
<body>
  <form id="addressForm">
    <input id="address" type="text" inputmode="url" autocomplete="url"
      placeholder="https://example.com or /internal/page" aria-label="Web page URL">
    <button type="submit">Load</button>
    <button id="reload" class="secondary" type="button" title="Reload page">Reload</button>
  </form>
  <div id="message" role="status">Enter an http(s) URL.</div>
  <iframe id="page" title="Embedded web page" allow="fullscreen; autoplay; picture-in-picture"
    referrerpolicy="no-referrer-when-downgrade"></iframe>

  <script>
    let nextId = 0;
    const pending = new Map();
    const address = document.getElementById("address");
    const page = document.getElementById("page");
    const message = document.getElementById("message");

    function call(method, params = {}, timeoutMs = 15000) {
      return new Promise((resolve, reject) => {
        if (window.parent === window) {
          reject(new Error("Open this plugin from UGS Dashboard."));
          return;
        }
        const id = ++nextId;
        const timer = timeoutMs > 0 ? setTimeout(() => {
          pending.delete(id);
          reject(new Error(`No reply to ${method}; check Dashboard.`));
        }, timeoutMs) : null;
        pending.set(id, { resolve, reject, timer });
        try {
          window.parent.postMessage({ type: "fluid-request", id, method, params }, "*");
        } catch (error) {
          clearTimeout(timer);
          pending.delete(id);
          reject(error);
        }
      });
    }

    function show(text, isError = false) {
      message.textContent = text;
      message.classList.toggle("error", isError);
    }

    function resolveAddress(raw) {
      const value = raw.trim();
      if (!value) throw new Error("Enter a URL first.");
      let url;
      try { url = new URL(value, window.location.href); }
      catch { throw new Error("That is not a valid URL."); }
      if (url.protocol !== "http:" && url.protocol !== "https:") {
        throw new Error("Only http:// and https:// pages can be embedded.");
      }
      return url.href;
    }

    async function saveUrl(url) {
      try {
        const settings = await call("getSettings");
        await call("saveSettings", { data: { ...settings, url } });
      } catch (error) {
        // A page viewer remains useful if settings are unavailable; report it
        // without preventing the requested page from loading.
        show(`Loaded, but could not save the URL: ${error.message}`, true);
      }
    }

    function load(raw) {
      let url;
      try { url = resolveAddress(raw); }
      catch (error) { show(error.message, true); return; }
      address.value = url;
      page.src = url;
      show(`Loading ${url}`);
      void saveUrl(url);
    }

    window.addEventListener("message", (event) => {
      if (event.source !== window.parent) return;
      const data = event.data;
      if (!data || typeof data !== "object") return;
      if (data.type === "fluid-response") {
        const request = pending.get(data.id);
        if (!request) return;
        pending.delete(data.id);
        clearTimeout(request.timer);
        if (data.error !== undefined) request.reject(new Error(data.error));
        else request.resolve(data.result);
      }
    });

    document.getElementById("addressForm").addEventListener("submit", (event) => {
      event.preventDefault();
      load(address.value);
    });
    document.getElementById("reload").addEventListener("click", () => {
      if (page.src) page.src = page.src;
    });
    page.addEventListener("load", () => show(`Showing ${address.value}`));

    (async () => {
      try {
        const settings = await call("getSettings");
        if (settings && settings.url) load(settings.url);
      } catch (error) {
        show(error.message, true);
      }
    })();
  </script>
</body>
</html>
